# Releases with release-please, then deploys the released version to the OVH VPS
# (rootless podman as user arena, Cloudflare Tunnel altered-arena.yutsa.fr -> 127.0.0.1:8080).
#
# Every push to main updates the release PR (CHANGELOG + version) from Conventional Commits
# (feat:, fix:, perf:, feat!: ...). Merging that PR creates the tag and the GitHub release,
# and this workflow then builds the image and deploys it. "Run workflow" redeploys an
# existing version (e.g. 0.2.0).
#
# Secrets of the GitHub environment `production`:
#   VPS_HOST         hostname of the VPS
#   VPS_SSH_KEY      private key whose public key is the forced-command key of user arena
#                    (deploy/vps/arena-deploy)
#   VPS_KNOWN_HOSTS  ssh-keyscan output of the VPS (pinned host keys)

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to deploy again, e.g. 0.2.0"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch, create the tag and the GitHub release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  ci:
    name: CI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy to VPS
    # A new release deploys once CI passed on it; "Run workflow" redeploys a released version
    needs: [release-please, ci]
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (needs.release-please.outputs.release_created == 'true' && needs.ci.result == 'success')
      )
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://altered-arena.yutsa.fr/
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.release-please.outputs.version }}
    steps:
      - name: Check version
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $VERSION"; exit 1; }'

      - name: Checkout altered-arena v${{ env.VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ env.VERSION }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: localhost/altered-arena:${{ env.VERSION }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          docker save "localhost/altered-arena:$VERSION" | gzip -1 \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
                "arena@$VPS_HOST" "deploy $VERSION"

      - name: Smoke test
        run: |
          for _ in $(seq 1 10); do
            curl -fsS -o /dev/null https://altered-arena.yutsa.fr/ && exit 0
            sleep 3
          done
          echo "https://altered-arena.yutsa.fr/ does not answer" >&2
          exit 1

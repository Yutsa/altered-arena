[package]
name = "altered-ai"
description = "AIs for the tournament decks, playing headless games on the translated engine"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
altered-rules = { path = "../rules" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
rand = "0.9"
rand_chacha = "0.9"
